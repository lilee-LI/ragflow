name: gaussdb-e2e-dual

services:
  gaussdb-proxy:
    image: ${RAGFLOW_IMAGE:-infiniflow/ragflow:v0.26.4}
    container_name: gaussdb-e2e-dual-proxy
    environment:
      GAUSSDB_PROXY_LISTEN_PORT: "15432"
      GAUSSDB_PROXY_UPSTREAM_HOST: ${GAUSSDB_UPSTREAM_HOST:?GAUSSDB_UPSTREAM_HOST is required}
      GAUSSDB_PROXY_UPSTREAM_PORT: ${GAUSSDB_UPSTREAM_PORT:?GAUSSDB_UPSTREAM_PORT is required}
    volumes:
      - D:/RAGFlow/e2e-env/gaussdb_tcp_proxy.py:/srv/gaussdb_tcp_proxy.py:ro
    entrypoint: python
    command: /srv/gaussdb_tcp_proxy.py
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      ragflow:
        aliases:
          - gaussdb-e2e-dual-proxy
    restart: unless-stopped

  tei:
    image: ${RAGFLOW_IMAGE:-infiniflow/ragflow:v0.26.4}
    container_name: gaussdb-e2e-dual-tei
    environment:
      TEI_TARGET: http://host.docker.internal:18080
    volumes:
      - D:/RAGFlow/e2e-env/tei_host_proxy.py:/srv/tei_host_proxy.py:ro
    entrypoint: python
    command: /srv/tei_host_proxy.py
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      ragflow:
        aliases:
          - tei
    restart: unless-stopped

  ragflow-cpu:
    image: ${RAGFLOW_E2E_IMAGE:-ragflow-gaussdb-e2e-dual:v0.26.4-deps}
    build:
      context: .
      dockerfile: Dockerfile.gaussdb-dual-e2e
    container_name: gaussdb-e2e-dual-ragflow
    command:
      - --disable-datasync
    env_file: .env
    environment:
      DOC_ENGINE: gaussdb
      DB_TYPE: gaussdb
      METADATA_DB_PROFILE: gaussdb
      COMPOSE_PROFILES: gaussdb,cpu,tei-cpu,metadata-gaussdb
      GAUSSDB_VARIANT: ${GAUSSDB_VARIANT:?GAUSSDB_VARIANT is required}
      GAUSSDB_HOST: gaussdb-e2e-dual-proxy
      GAUSSDB_PORT: "15432"
      GAUSSDB_DATABASE: docgine_gaussdb_zlw
      GAUSSDB_USER: zlw
      GAUSSDB_PASSWORD: ${GAUSSDB_E2E_PASSWORD:?GAUSSDB_E2E_PASSWORD is required}
      GAUSSDB_SCHEMA: zlw
      GAUSSDB_EXPECTED_VECTOR_DIMS: ${GAUSSDB_EXPECTED_VECTOR_DIMS:?GAUSSDB_EXPECTED_VECTOR_DIMS is required}
      GAUSSDB_METADATA_HOST: ${GAUSSDB_UPSTREAM_HOST:?GAUSSDB_UPSTREAM_HOST is required}
      GAUSSDB_METADATA_PORT: ${GAUSSDB_UPSTREAM_PORT:?GAUSSDB_UPSTREAM_PORT is required}
      GAUSSDB_METADATA_USER: zlw
      GAUSSDB_METADATA_PASSWORD: ${GAUSSDB_E2E_PASSWORD:?GAUSSDB_E2E_PASSWORD is required}
      GAUSSDB_METADATA_DBNAME: docgine_gaussdb_zlw
      GAUSSDB_METADATA_SCHEMA: ${GAUSSDB_E2E_METADATA_SCHEMA:?GAUSSDB_E2E_METADATA_SCHEMA is required}
      TEI_HOST: tei
      TEI_MODEL: BAAI/bge-large-en-v1.5
      EMBEDDING_BATCH_SIZE: "${GAUSSDB_E2E_EMBEDDING_BATCH_SIZE:-8}"
      LLM_TIMEOUT_SECONDS: "${GAUSSDB_E2E_LLM_TIMEOUT_SECONDS:-1200}"
      CHUNK_FEEDBACK_ENABLED: ${CHUNK_FEEDBACK_ENABLED:-false}
      CHUNK_FEEDBACK_WEIGHTING: ${CHUNK_FEEDBACK_WEIGHTING:-uniform}
      GAUSSDB_E2E_SOURCE_REVISION: ${GAUSSDB_E2E_SOURCE_REVISION:?GAUSSDB_E2E_SOURCE_REVISION is required}
      REDIS_HOST: redis
      MINIO_HOST: minio
      REGISTER_ENABLED: "1"
      RAG_PROJECT_BASE: /tmp/gaussdb-dual-e2e-runtime
      GAUSSDB_E2E_SKIP_DB_INIT: "${GAUSSDB_E2E_SKIP_DB_INIT:-1}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /opt/gaussdb-python/site:/tmp/gaussdb-dual-e2e-runtime:/ragflow
      LD_LIBRARY_PATH: /opt/gaussdb-python/lib
    entrypoint: ./entrypoint.sh
    ports:
      - "28080:80"
      - "29380:9380"
      - "29381:9381"
    volumes:
      - ../:/e2e-code:ro
      - ./ragflow-logs-dual-e2e:/ragflow/logs
      - ./entrypoint.sh:/ragflow/entrypoint.base.sh:ro
      - ./entrypoint.gaussdb-dual-e2e.sh:/ragflow/entrypoint.sh:ro
      - D:/RAGFlow/codex-gauss-py313-runtime/site:/opt/gaussdb-python/site:ro
      - D:/RAGFlow/codex-gauss-py313-runtime/lib/runtime-libs:/opt/gaussdb-python/lib:ro
    depends_on:
      - gaussdb-proxy
      - tei
    networks:
      ragflow:
        aliases:
          - ragflow-e2e
    restart: unless-stopped

networks:
  ragflow:
    external: true
    name: docker_ragflow
